<main>
  <section class="catalog-panel">
    <div class="catalog-panel__options">
      <div class="select-container">
        <mat-label class="select-container__label">Category</mat-label>
        <mat-select [(ngModel)]="category" class="select-container__options">
          <mat-option value="">All</mat-option>
          <mat-option
            *ngFor="let category of categories | keyvalue"
            [value]="category.key"
            (click)="onCategoryChange($event)"
          >
            {{ category.key }}
          </mat-option>
        </mat-select>
      </div>
      <div class="select-container">
        <div class="select-container__label sub-label">
          <div>Subcategory:</div>
          <div class="subcategory">{{ subcategory }}</div>
        </div>
      </div>
    </div>
    <div class="catalog-panel__options">
      <div class="select-container">
        <mat-label class="select-container__label">Brand</mat-label>
        <mat-select
          [(ngModel)]="selectedValue"
          class="select-container__options"
          (ngModelChange)="onValueFilterChange($event, 'brand')"
        >
          <mat-option value="">All brands</mat-option>
          <mat-option *ngFor="let brand of brands" [value]="brand">
            {{ brand }}
          </mat-option>
        </mat-select>
      </div>

      <div class="select-container">
        <mat-label class="select-container__label">Color</mat-label>
        <mat-select
          [(ngModel)]="selectedValue"
          class="select-container__options"
          (ngModelChange)="onValueFilterChange($event, 'color')"
        >
          <mat-option value="">All colors</mat-option>
          <mat-option *ngFor="let color of colors" [value]="color">
            {{ color }}
          </mat-option>
        </mat-select>
      </div>

      <div class="select-container">
        <mat-label class="select-container__label">Sort by</mat-label>
        <mat-select
          id="sort"
          [(ngModel)]="sortOption"
          class="select-container__options"
          (ngModelChange)="onValueSortChange($event)"
        >
          <mat-option value="name.en-US asc">Name A-Z</mat-option>
          <mat-option value="name.en-US desc">Name Z-A</mat-option>
          <mat-option value="variants.attributes.price.centAmount asc">Price⬆️</mat-option>
          <mat-option value="variants.attributes.price.centAmount desc">Price⬇️</mat-option>
        </mat-select>
      </div>
    </div>
    <div class="catalog-panel__options">
      <div class="search-box">
        <input
          [ngModel]="searchQuery()"
          (ngModelChange)="searchQuery.set($event)"
          class="search-input"
          type="text"
          placeholder="Search..."
        />
        <button *ngIf="searchQuery()" class="clear-btn" (click)="clearSearchQuery()">
          <mat-icon>close</mat-icon>
        </button>
      </div>
    </div>
  </section>
  <section class="cards-grid">
    <app-product-card *ngFor="let product of products()" [product]="product"></app-product-card>
  </section>
</main>
