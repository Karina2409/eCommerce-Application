<form class="login-form login-form_shadow" [formGroup]="form" (ngSubmit)="onSubmitAction()">
  <h1>Log In</h1>

  <label class="login__form-label">
    <input
      class="login__form-input"
      type="email"
      placeholder="Enter email"
      formControlName="username"
    />
  </label>

  <label class="login__form-label">
    <input
      class="login__form-input"
      [type]="showPassword ? 'text' : 'password'"
      placeholder="Enter password"
      formControlName="password"
    />
  </label>
  <label class="login__form-checkbox">
    <input type="checkbox" (change)="togglePassword()" />
    Show Password
  </label>
  <button class="login__form-button" mat-flat-button type="submit" [disabled]="!form.valid">
    Log In
  </button>
  <button class="login__form-button" mat-flat-button type="button" routerLink="/main">
    Cancel
  </button>
</form>

<div class="login-info" *ngIf="form.get('username')?.touched && form.get('username')?.invalid">
  <small *ngIf="form.get('username')?.errors?.['required']"> Email is required.</small>
  <small *ngIf="form.get('username')?.errors?.['email']"> Invalid email format.</small>
  <small *ngIf="form.get('username')?.errors?.['pattern']">
    No whitespace or invalid email domain.</small
  >
</div>
<div class="login-info" *ngIf="form.get('password')?.touched && form.get('password')?.invalid">
  <small *ngIf="form.get('password')?.errors?.['required']">Password is required</small>
  <small *ngIf="form.get('password')?.errors?.['minlength']"
    >Password must be at least 8 characters</small
  >
  <small *ngIf="form.get('password')?.errors?.['pattern']">
    Password must include uppercase, lowercase, number and special character.
  </small>
</div>
