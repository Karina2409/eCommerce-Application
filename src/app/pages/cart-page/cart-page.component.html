<section class="items-container">
  @if (cartItems().length > 0) {
    <app-cart-product
      *ngFor="let item of cartItems()"
      [cartItem]="item"
      (myOutput)="getCartItems()"
    ></app-cart-product>
  } @else {
    <div class="empty-field">
      <p>Cart is empty</p>
      <button
        mat-flat-button
        routerLink="/catalog"
      >
        Back to catalog
      </button>
    </div>
  }
</section>
<section class="cart-control">
  <form class="promo-container">
    <input
      #promoInput
      class="promo-input"
      type="text"
      placeholder="Enter promo code..."
    />
    <button
      (click)="
        cartManipulation.applyDiscountCode(cartService, authService, promoInput.value);
        setPrevPrice()
      "
      mat-flat-button
    >
      Apply
    </button>
  </form>

  <div class="total-count">
    <div>
      Total:
      <span
        *ngIf="prevPrice()"
        class="strikethrough"
        >{{ prevPrice() }} {{ currentCurrency() }}</span
      >
      {{ totalPrice() }} {{ currentCurrency() }}
    </div>
  </div>

  <button
    mat-flat-button
    (click)="
      cartManipulation.removeDiscountCode(cartService, authService, promoInput.value);
      cartManipulation.removeAllProducts(cartService, authService, cartItems());
      clearPrevPrice()
    "
  >
    Clear Cart
  </button>
</section>
