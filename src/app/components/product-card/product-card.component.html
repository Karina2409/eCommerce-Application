<div class="card-list-container">
  <mat-card class="card" *ngFor="let variant of allVariants" (click)="openProductPage(variant)">
    <div class="image-container">
      <img mat-card-image [src]="variant.images?.[0]?.url" alt="product image" class="card-img" />
    </div>
    <mat-card-content class="card__info">
      <h3>{{ getName() }}</h3>
      <p>{{ getDescription() }}</p>
      <div class="card-text"><span>Brand:</span> {{ getAttribute(variant, 'brand') }}</div>
      <div class="card-text"><span>Color:</span> {{ getAttribute(variant, 'color') }}</div>
      <div class="card-text"><span>Price:</span> {{ getAttribute(variant, 'price') }}</div>
    </mat-card-content>
    <mat-card-actions>
      <button mat-flat-button class="card-button">Add to cart</button>
    </mat-card-actions>
  </mat-card>
</div>
