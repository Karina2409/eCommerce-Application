@if (show) {
  <div class="modal">
    <div class="modal-container">
      <button
        mat-icon-button
        class="corn-icon"
        matTooltip="Close"
        (click)="onClose()"
      >
        <mat-icon>close</mat-icon>
      </button>
      <div class="modal-body">
        <ng-content></ng-content>
      </div>
    </div>
  </div>
}
