@if (show) {
  <div class="modal">
    <div class="modal-container">
      <div class="modal-body">
        <ng-content></ng-content>
      </div>
      <div class="modal-footer">
        <button
          mat-flat-button
          (click)="onClose()"
        >
          Cancel
        </button>
        <button
          mat-flat-button
          (click)="onConfirm()"
        >
          OK
        </button>
      </div>
    </div>
  </div>
}
